<div class="admin-shell">
  <header class="topbar">
    <a class="brand" routerLink="/admin/products" aria-label="Ferragens, início">
      <span class="brand-mark">F</span>
      <span>FERRAGENS <small>GESTÃO</small></span>
    </a>
    <div class="topbar-user">
      <span class="user-name">{{ auth.currentUser()?.username }}</span>
      <button mat-button type="button" [disabled]="logoutPending()" (click)="logout()">{{ logoutPending() ? 'Saindo...' : 'Sair' }}</button>
    </div>
  </header>
  @if (logoutError()) { <p class="logout-error" role="alert">{{ logoutError() }}</p> }

  <div class="admin-body">
    <nav class="side-nav" aria-label="Navegação administrativa">
      <p class="nav-caption">CADASTROS</p>
      <a routerLink="/admin/products" routerLinkActive="active" ariaCurrentWhenActive="page">
        <span class="nav-marker" aria-hidden="true"></span>Produtos
      </a>
      <p class="nav-caption">OPERAÇÃO</p>
      <a routerLink="/admin/inventory" routerLinkActive="active" ariaCurrentWhenActive="page"><span class="nav-marker" aria-hidden="true"></span>Estoque</a>
    </nav>
    <main class="workspace"><router-outlet /></main>
  </div>
</div>
