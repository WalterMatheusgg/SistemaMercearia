name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend · Java 21 e PostgreSQL 18
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Testar e empacotar com PostgreSQL e Mailpit reais
        run: ./mvnw --batch-mode verify

  frontend:
    name: Frontend · testes e build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test -- --watch=false
      - run: npm run build

  end-to-end:
    name: Loja completa · navegador, API, banco e e-mail
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: frontend/.nvmrc
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Preparar ambiente isolado do teste
        run: |
          cp .env.example .env
          python3 - <<'PY'
          from pathlib import Path
          p=Path('.env')
          s=p.read_text().replace('replace-with-a-long-local-password','local-e2e-password-123456')
          p.write_text(s)
          PY
      - name: Validar script de sincronização
        run: |
          bash -n scripts/sync-codespace.sh
          bash scripts/sync-codespace.sh --help > /dev/null
      - name: Testar proteção da configuração de produção
        run: python3 -m unittest discover -s scripts/tests -p 'test_*.py' -v
      - name: Validar manifests de publicação comercial sem acessar segredos
        run: |
          APP_DOMAIN=example.test docker compose --env-file .env \
            -f infra/compose.production.yaml \
            -f infra/compose.https.yaml config --quiet
      - name: Construir e iniciar a aplicação completa
        run: bash scripts/start.sh
      - name: Verificar saúde, catálogo e controle de acesso sem alterar dados
        run: SMOKE_MAILPIT_URL=http://localhost:8025 bash scripts/smoke.sh
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Testar desktop e celular com serviços reais
        # A API protege contra mais de 20 logins/minuto/IP. O CI divide
        # cenários por arquivo, reiniciando o app entre lotes de teste,
        # sem reduzir a proteção real de autenticação.
        run: |
          first=1
          for project in desktop mobile; do
            for spec in e2e/*.spec.ts; do
              if [ "$first" = 0 ]; then
                docker compose -f ../compose.yaml --profile app restart app
                for attempt in $(seq 1 40); do
                  if curl -fsS http://localhost:8080/actuator/health 2>/dev/null | grep -q '"UP"'; then
                    break
                  fi
                  sleep 2
                done
                curl -fsS http://localhost:8080/actuator/health | grep -q '"UP"'
              fi
              first=0
              echo "Executando Playwright: $project / $spec"
              npm run e2e -- --project="$project" "$spec"
            done
          done
        working-directory: frontend
        env:
          E2E_BASE_URL: http://localhost:8080
          E2E_ADMIN_USER: admin
          E2E_ADMIN_PASSWORD: local-e2e-password-123456
      - name: Guardar evidências dos testes de navegador em caso de falha
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-errors
          path: |
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7
      - name: Conferir backup e restauração em banco separado
        run: |
          backup=$(bash scripts/backup.sh)
          bash scripts/restore-test.sh "$backup" ferragens_restore_check
      - name: Logs em caso de falha
        if: failure()
        run: docker compose --profile app logs --tail=120 app
      - name: Encerrar o ambiente isolado do CI
        if: always()
        run: docker compose --profile app down --volumes
